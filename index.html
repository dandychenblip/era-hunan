<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>公元管道（湖南）有限公司</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #f4f6f9;
    color: #1a1a1a;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: linear-gradient(160deg, #0a2540 0%, #123a5e 45%, #1b6ca8 100%);
    min-height: 100vh;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,.28);
    overflow: hidden;
    padding: 34px 24px 26px;
    text-align: center;
  }
  .logo {
    display: block;
    width: 50%;
    max-width: 160px;
    height: auto;
    margin: 0 auto 14px;
    object-fit: contain;
  }
  h1 {
    font-size: 21px;
    font-weight: 700;
    color: #0a2540;
    line-height: 1.4;
  }
  .slogan {
    margin-top: 12px;
    font-size: 14px;
    color: #5a6b7b;
    letter-spacing: .5px;
  }

  .sub-title {
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    color: #0a2540;
    margin: 4px 0 16px;
    line-height: 1.5;
    letter-spacing: .5px;
  }
  .video-box {
    margin: 26px 0 8px;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    background: #0a2540;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-box .bili-player {
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 16px;
    background: #000;
  }

  .btn-group {
    display: flex;
    gap: 14px;
    margin-top: 26px;
  }
  .btn {
    flex: 1;
    text-decoration: none;
    padding: 15px 10px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    transition: transform .15s, opacity .15s;
    display: block;
  }
  .btn:active { transform: scale(.97); opacity: .88; }
  .btn.company { background: linear-gradient(135deg, #1b6ca8, #15588a); }
  .btn.group { background: linear-gradient(135deg, #e6392f, #c62a22); }

  .footer {
    margin-top: 22px;
    font-size: 11px;
    color: #9aa7b3;
    line-height: 1.6;
  }
  .footer b { color: #1b6ca8; }
</style>
</head>
